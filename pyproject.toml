[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kanaryatara"
version = "0.1.0"
description = "RAG bilgi tabanı bütünlük ve zehirlenme şüphesi denetçisi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
authors = [{name = "Arda Meçik"}]

[project.scripts]
kanaryatara = "kanaryatara.cli:ana"

[tool.setuptools.packages.find]
include = ["kanaryatara*"]
