[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kanaryatara"
version = "0.1.0"
description = "RAG bilgi tabanı bütünlük ve zehirlenme şüphesi denetçisi"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []
authors = [{name = "Arda Meçik"}]
keywords = [
    "llm-security",
    "rag",
    "rag-security",
    "data-poisoning",
    "canary-token",
    "embedding-drift",
    "owasp-llm",
    "turkce",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Turkish",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

[project.optional-dependencies]
test = [
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/mecik-arda/kanaryatara"
Issues = "https://github.com/mecik-arda/kanaryatara/issues"

[project.scripts]
kanaryatara = "kanaryatara.cli:ana"

[tool.setuptools.packages.find]
include = ["kanaryatara*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
